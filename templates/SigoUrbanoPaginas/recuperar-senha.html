<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SigoUrbano - Recuperar Senha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --cor-teal: #009a96;
            --cor-teal-hover: #007f7c;
            --cor-teal-claro: #f0fdfa;
            --cor-marinho: #0a2540;
            --cor-marinho-hover: #06182b;
            --cinza-texto: #475569;
            --cinza-borda: #e2e8f0;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--cinza-texto);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            
            /* GRADIENTE AZUL RESTRUTURADO COM MENOR OPACIDADE (0.45) PARA EXIBIR A CIDADE */
            background: linear-gradient(135deg, rgba(10, 37, 64, 0.45) 0%, rgba(5, 20, 36, 0.55) 100%), 
                        url('https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?q=80&w=1920') center/cover no-repeat fixed;
            padding: 20px;
        }

        /* Card Elegante com Sombra Destacada para Fundos Claros */
        .card-recuperacao {
            background: #ffffff;
            border: 1px solid rgba(10, 37, 64, 0.05);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(10, 37, 64, 0.1);
            overflow: hidden;
            max-width: 480px;
            width: 100%;
            animation: fadeInUp 0.5s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Identidade Visual */
        .brand-header {
            text-align: center;
            padding: 2.5rem 2rem 1.5rem 2rem;
            border-bottom: 1px solid var(--cinza-borda);
            background: #ffffff;
        }
        .logo-img {
            height: 46px;
            width: auto;
            margin-bottom: 0.75rem;
        }

        /* Formulários e Inputs */
        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--cor-marinho);
        }
        .form-control {
            border-radius: 10px;
            padding: 0.75rem 1rem;
        }
        .form-control:focus {
            border-color: var(--cor-teal);
            box-shadow: 0 0 0 0.25rem rgba(0, 154, 150, 0.15);
        }
        .input-group-text {
            background-color: #f8fafc;
            border-color: #ced4da;
            color: var(--cinza-texto);
            border-top-left-radius: 10px !important;
            border-bottom-left-radius: 10px !important;
        }
        .form-control {
            border-top-right-radius: 10px !important;
            border-bottom-right-radius: 10px !important;
        }

        /* Caixa de Instruções Interna */
        .box-instrucoes {
            background-color: var(--cor-teal-claro);
            border: 1px solid rgba(0, 154, 150, 0.15);
            color: var(--cor-marinho);
            border-radius: 14px;
            padding: 1.25rem;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        /* Botões */
        .btn-teal {
            background-color: var(--cor-teal);
            color: white;
            font-weight: 600;
            border: none;
            transition: all 0.2s ease;
            border-radius: 50px;
            padding: 0.75rem;
        }
        .btn-teal:hover {
            background-color: var(--cor-teal-hover);
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(0, 154, 150, 0.25);
        }
        
        .link-marinho {
            color: var(--cor-marinho);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }
        .link-marinho:hover {
            color: var(--cor-teal);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <main class="w-100 d-flex justify-content-center align-items-center">
        <div class="card-recuperacao">
            
            <div class="brand-header">
                <img src="C:\Users\20231imi037\Documents\implementaçaosigourbano\SigoUrbano\templates\SigoUrbanoPaginas\logo_cor.png" alt="SigoUrbano Logo" class="logo-img">
                <h1 class="h4 fw-bold mb-1">
                    <span style="color: var(--cor-teal)">Sigo</span><span style="color: var(--cor-marinho)">Urbano</span>
                </h1>
                <p class="text-muted small mb-0">Gestão Integrada de Ocorrências Urbanas</p>
            </div>

            <div class="p-4 p-md-5 bg-white">
                
                <div class="box-instrucoes mb-4">
                    <div class="d-flex gap-3">
                        <div class="text-teal pt-1">
                            <i class="bi bi-shield-lock-fill fs-4"></i>
                        </div>
                        <div>
                            <strong class="d-block mb-1 text-dark" style="font-weight: 650;">Recuperação de Acesso</strong>
                            Insira o e-mail da sua conta de cidadão. Enviaremos um link seguro e exclusivo para criar uma nova senha.
                        </div>
                    </div>
                </div>

                <form id="formRecuperarSenha" class="needs-validation" novalidate>
                    
                    <div class="mb-4">
                        <label for="email" class="form-label">E-mail Cadastrado</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" id="email" class="form-control" placeholder="exemplo@email.com" required autocomplete="email">
                            <div class="invalid-feedback">Por favor, introduza um e-mail válido para receber as instruções.</div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-teal w-100 shadow-sm mb-4">
                        <i class="bi bi-send-fill me-2"></i>Enviar Link de Redefinição
                    </button>

                    <div class="text-center d-flex justify-content-between border-top pt-3 small">
                        <a href="#" class="link-marinho"><i class="bi bi-arrow-left me-1"></i>Voltar para o Login</a>
                        <a href="#" class="link-marinho">Criar nova conta</a>
                    </div>

                </form>
            </div>

        </div> </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        (() => {
            'use strict'
            const form = document.getElementById('formRecuperarSenha');

            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                } else {
                    event.preventDefault();
                    
                    const emailInserido = document.getElementById('email').value;
                    alert(`Instruções enviadas!\n\nUm e-mail com as diretrizes e o link de redefinição segura foi encaminhado para:\n${emailInserido}\n\nVerifique a sua caixa de entrada ou spam.`);
                }

                form.classList.add('was-validated');
            }, false);
        })();
    </script>
</body>
</html>
